server:
  port: ${SERVER_PORT:3001}

spring:
  application:
    name: asterflow-erp-server

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/asterflow_erp?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      timeout: ${REDIS_TIMEOUT:3s}

  ai:
    openai:
      api-key: ${OPENAI_API_KEY:local-dev-placeholder}
      chat:
        model: ${OPENAI_CHAT_MODEL:gpt-5-mini}

jwt:
  secret: ${JWT_SECRET:asterflow-erp-secret-key-change-me}
  expire-hours: ${JWT_EXPIRE_HOURS:24}
  access-token-expire-minutes: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:30}
  refresh-token-expire-days: ${JWT_REFRESH_TOKEN_EXPIRE_DAYS:7}

erp:
  auth:
    session-store: ${ERP_AUTH_SESSION_STORE:local}
  cache:
    type: ${ERP_CACHE_TYPE:local}
    dashboard-summary-ttl-seconds: ${ERP_DASHBOARD_SUMMARY_TTL_SECONDS:60}
    product-detail-ttl-seconds: ${ERP_PRODUCT_DETAIL_TTL_SECONDS:300}
    product-missing-ttl-seconds: ${ERP_PRODUCT_MISSING_TTL_SECONDS:30}
  idempotency:
    store: ${ERP_IDEMPOTENCY_STORE:local}
  rate-limit:
    enabled: ${ERP_RATE_LIMIT_ENABLED:false}
    window-seconds: ${ERP_RATE_LIMIT_WINDOW_SECONDS:60}
    login-limit: ${ERP_RATE_LIMIT_LOGIN_LIMIT:10}
    api-limit: ${ERP_RATE_LIMIT_API_LIMIT:120}

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:true}
