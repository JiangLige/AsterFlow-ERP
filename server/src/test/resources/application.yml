spring:
  datasource:
    url: jdbc:h2:mem:asterflow_erp_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

jwt:
  secret: test-secret-key
  access-token-expire-minutes: 30
  refresh-token-expire-days: 7

erp:
  auth:
    session-store: redis
  cache:
    type: local

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
