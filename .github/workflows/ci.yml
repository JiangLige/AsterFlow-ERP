name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  delivery:
    name: Delivery Configuration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: docker compose config

  frontend:
    name: Frontend Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --audit-level=high

      - name: Run frontend tests
        run: npm run test:client

      - name: Lint frontend
        run: npm --workspace client run lint

      - name: Build frontend
        run: npm run build:client

  e2e:
    name: Portfolio Browser E2E
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npm --workspace client exec playwright install --with-deps chromium

      - name: Make Maven Wrapper executable
        run: chmod +x server/mvnw

      - name: Run full-stack browser workflow
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            client/playwright-report
            client/test-results
          retention-days: 7

  backend:
    name: Backend Test And Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Make Maven Wrapper executable
        run: chmod +x server/mvnw

      - name: Test and build backend
        working-directory: server
        run: ./mvnw -B clean verify

  mysql-migration:
    name: MySQL Flyway Migration
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: asterflow_erp
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Make Maven Wrapper executable
        run: chmod +x server/mvnw

      - name: Validate Flyway migration against MySQL 8
        working-directory: server
        run: >-
          ./mvnw -B
          -Dtest=AsterFlowErpApplicationTests
          -Dspring.datasource.url="jdbc:mysql://127.0.0.1:3306/asterflow_erp?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8"
          -Dspring.datasource.username=root
          -Dspring.datasource.password=root
          -Dspring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
          -Dspring.flyway.enabled=true
          -Dspring.sql.init.mode=never
          test
